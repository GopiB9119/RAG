[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "2.0.0"
description = "Ask questions about thousands of PDFs: fast hybrid search with cited answers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24,<2",
    "numpy>=1.26,<3",
    "onnxruntime>=1.17,<2",
    "tokenizers>=0.15,<1",
    "openai>=1.40,<3",
    "python-dotenv>=1,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: needs the downloaded embedding model (skipped when it is absent)"]
